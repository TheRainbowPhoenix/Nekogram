name: Build Nekogram

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [debug, release]
        include:
          - type: debug
            task: assembleDebug
            name: "Debug"
          - type: release
            task: assembleRelease
            name: "Release"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew TMessagesProj_App:${{ matrix.task }}

      - name: Extract Version
        run: |
          grep VERSION_NAME TMessagesProj/build/generated/source/buildConfig/${{ matrix.type }}/org/telegram/messenger/BuildConfig.java | cut -d'"' -f 2 > ver.txt || echo "unknown" > ver.txt
          echo "VERSION=$(cat ver.txt)" >> $GITHUB_ENV

      - name: Prepare Artifact
        run: |
          mkdir -p artifact
          if [ "${{ matrix.type }}" == "release" ]; then
            find TMessagesProj_App/build/outputs/apk/release -name "*.apk" -exec cp {} "artifact/Nekogram_$(cat ver.txt)_${{ matrix.name }}.apk" \;
          else
            find TMessagesProj_App/build/outputs/apk/debug -name "*.beta.apk" -exec cp {} "artifact/Nekogram_$(cat ver.txt)_${{ matrix.name }}.apk" \;
            find TMessagesProj_App/build/outputs/apk/debug -name "*.apk" ! -name "*.beta.apk" -exec cp {} "artifact/Nekogram_$(cat ver.txt)_${{ matrix.name }}.apk" \; || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nekogram-${{ matrix.type }}
          path: artifact/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: Nekogram-debug
          path: debug_asset

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: Nekogram-release
          path: release_asset

      - name: Get version info
        run: |
          find release_asset -name "*.apk" | head -1 | sed 's/.*Nekogram_//;s/_Release\.apk//' > version.txt || echo "build" > version.txt
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: |
            debug_asset/*
            release_asset/*
          tag_name: v${{ env.VERSION }}
          name: "Nekogram ${{ env.VERSION }}"
          body: "Automated build of Nekogram version ${{ env.VERSION }}"
